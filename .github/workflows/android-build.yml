name: Build & Release (Android APK/AAB + iOS)

# - Push / PR ke main: build APK & AAB rilis, hasilnya diunggah sebagai artifact Actions.
# - Push tag "v<versi>" (mis. v2.9.1): build yang sama + GitHub Release berisi APK & AAB bertanda tangan.
# - Bisa juga dijalankan manual dari tab Actions (workflow_dispatch).
#
# Secret repositori yang dibutuhkan (Settings -> Secrets and variables -> Actions):
#   DEPUP_KEYSTORE_BASE64   isi berkas .jks dalam base64   (macOS: base64 -i app/depup-upload.jks | pbcopy)
#   DEPUP_STORE_PASSWORD    kata sandi keystore
#   DEPUP_KEY_ALIAS         alias kunci
#   DEPUP_KEY_PASSWORD      kata sandi kunci
# Tanpa secret: build tetap jalan (APK/AAB tidak bertanda tangan), tapi rilis dari tag ditolak.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android — test, APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: ver
        run: |
          name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Versi aplikasi: $name ($code)"

      - name: Tag must match versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.ver.outputs.name }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak sama dengan versionName v${{ steps.ver.outputs.name }} di app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing keystore
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.DEPUP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DEPUP_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret DEPUP_KEYSTORE_BASE64 belum diisi: APK/AAB tidak bertanda tangan."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse unsigned release
        if: startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.signed != 'true'
        run: |
          echo "::error::Rilis dari tag butuh secret penandatanganan (DEPUP_KEYSTORE_BASE64, DEPUP_STORE_PASSWORD, DEPUP_KEY_ALIAS, DEPUP_KEY_PASSWORD)."
          exit 1

      - name: Unit tests (QC)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Check Play signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DEPUP_EXTRA_CERTS: ${{ secrets.DEPUP_EXTRA_CERTS }}
        run: |
          if [ -z "$DEPUP_EXTRA_CERTS" ]; then
            echo "::warning::Secret DEPUP_EXTRA_CERTS kosong. APK dari GitHub tetap lolos cek tanda tangan, tetapi versi Play Store (ditandatangani ulang Google) akan menolak membuka Dokumen Terlindungi. Isi dengan SHA-256 'App signing key' dari Play Console."
          fi

      - name: Build release APK & AAB
        env:
          DEPUP_EXTRA_CERTS: ${{ secrets.DEPUP_EXTRA_CERTS }}
          DEPUP_STORE_PASSWORD: ${{ secrets.DEPUP_STORE_PASSWORD }}
          DEPUP_KEY_ALIAS: ${{ secrets.DEPUP_KEY_ALIAS }}
          DEPUP_KEY_PASSWORD: ${{ secrets.DEPUP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Collect outputs
        run: |
          v="${{ steps.ver.outputs.name }}"
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          aab=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          cp "$apk" "dist/DepupOffice_v${v}.apk"
          cp "$aab" "dist/DepupOffice_v${v}.aab"
          ( cd dist && sha256sum * > SHA256SUMS-android.txt )
          ls -la dist

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DepupOffice_v${{ steps.ver.outputs.name }}
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS — uji & build (unsigned)
    # arm64 (Apple Silicon) lebih cepat; bila antrean GitHub penuh dan job gagal dimulai, job cadangan Intel di bawah
    # berjalan otomatis. Runner bisa dipaksa lewat variabel repositori IOS_RUNNER (mis. macos-15-intel).
    runs-on: ${{ vars.IOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Uji, build & IPA
        run: ci/ios-build.sh
      - name: Log uji
        if: failure()
        run: tail -200 build/ios-test.log || true
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DepupOffice_iOS
          path: dist/*
          if-no-files-found: error

  ios_intel:
    name: iOS — cadangan runner Intel
    needs: [ ios ]
    if: ${{ always() && needs.ios.result != 'success' }}
    runs-on: macos-15-intel   # image Intel terakhir GitHub, didukung hingga Agustus 2027
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Uji, build & IPA
        run: ci/ios-build.sh
      - name: Log uji
        if: failure()
        run: tail -200 build/ios-test.log || true
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DepupOffice_iOS
          path: dist/*
          if-no-files-found: error

  play:
    name: Upload ke Google Play (draft)
    # Hanya dari tag rilis. Butuh secret PLAY_SERVICE_ACCOUNT_JSON (isi berkas JSON service account Google Play
    # Developer API). Rilis dibuat sebagai DRAFT di jalur produksi: tidak ada yang dirilis ke pengguna
    # sebelum dikirim untuk ditinjau dari Play Console.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (catatan rilis Play)
        uses: actions/checkout@v4

      - name: Check Play credentials
        id: cred
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Secret PLAY_SERVICE_ACCOUNT_JSON belum diisi: unggah ke Play dilewati."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Download Android artifact
        if: steps.cred.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: DepupOffice_v*
          path: dist
          merge-multiple: true

      - name: Upload AAB to Google Play
        if: steps.cred.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cloud.depup.office
          releaseFiles: dist/*.aab
          track: ${{ vars.PLAY_TRACK || 'production' }}
          status: draft
          releaseName: ${{ github.ref_name }}
          whatsNewDirectory: distribution/whatsnew

  release:
    name: GitHub Release
    needs: [ build, ios, ios_intel ]
    # Rilis tetap jalan bila iOS lolos di salah satu runner (arm64 atau cadangan Intel).
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success' && (needs.ios.result == 'success' || needs.ios_intel.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (release notes)
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Depup Office ${{ github.ref_name }}
          body_path: RELEASE_NOTES_V4_2.md
          generate_release_notes: true
          files: dist/*
