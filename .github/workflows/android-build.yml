name: Android Build & Release (APK + AAB)

# - Push / PR ke main: build APK & AAB rilis, hasilnya diunggah sebagai artifact Actions.
# - Push tag "v<versi>" (mis. v2.9.1): build yang sama + GitHub Release berisi APK & AAB bertanda tangan.
# - Bisa juga dijalankan manual dari tab Actions (workflow_dispatch).
#
# Secret repositori yang dibutuhkan (Settings -> Secrets and variables -> Actions):
#   DEPUP_KEYSTORE_BASE64   isi berkas .jks dalam base64   (macOS: base64 -i app/depup-upload.jks | pbcopy)
#   DEPUP_STORE_PASSWORD    kata sandi keystore
#   DEPUP_KEY_ALIAS         alias kunci
#   DEPUP_KEY_PASSWORD      kata sandi kunci
# Tanpa secret: build tetap jalan (APK/AAB tidak bertanda tangan), tapi rilis dari tag ditolak.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: ver
        run: |
          name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Versi aplikasi: $name ($code)"

      - name: Tag must match versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.ver.outputs.name }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak sama dengan versionName v${{ steps.ver.outputs.name }} di app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing keystore
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.DEPUP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DEPUP_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret DEPUP_KEYSTORE_BASE64 belum diisi: APK/AAB tidak bertanda tangan."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse unsigned release
        if: startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.signed != 'true'
        run: |
          echo "::error::Rilis dari tag butuh secret penandatanganan (DEPUP_KEYSTORE_BASE64, DEPUP_STORE_PASSWORD, DEPUP_KEY_ALIAS, DEPUP_KEY_PASSWORD)."
          exit 1

      - name: Build release APK & AAB
        env:
          DEPUP_STORE_PASSWORD: ${{ secrets.DEPUP_STORE_PASSWORD }}
          DEPUP_KEY_ALIAS: ${{ secrets.DEPUP_KEY_ALIAS }}
          DEPUP_KEY_PASSWORD: ${{ secrets.DEPUP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Collect outputs
        run: |
          v="${{ steps.ver.outputs.name }}"
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          aab=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          cp "$apk" "dist/DepupOffice_v${v}.apk"
          cp "$aab" "dist/DepupOffice_v${v}.aab"
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -la dist

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DepupOffice_v${{ steps.ver.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Depup Office ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
